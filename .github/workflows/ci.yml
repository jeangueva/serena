name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Un push encima de otro cancela el run viejo: nadie mira el resultado de un
# commit ya reemplazado, y las minutas de Actions no son gratis en repo privado.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck · tests · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      # La versión de pnpm sale del campo `packageManager` del package.json raíz.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Tests
        run: pnpm --filter @serena/backend-edge test

      # Los tres builds: dry-run del worker, bundle del panel y prerender de la
      # landing. Ninguno necesita credenciales reales.
      - name: Build
        run: pnpm -r build
        env:
          VITE_SUPABASE_URL: https://ci.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-anon-key
